<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#123f36"><link rel="manifest" href="manifest.webmanifest"><link rel="stylesheet" href="style.css"><title>HAI ĐẤT SLIDES</title></head><body><header><div><div class="brand">HAI ĐẤT SLIDES</div><div class="sub">Tạo bài trình chiếu · V1</div></div><button id="install" hidden>Cài ứng dụng</button></header><main><div class="toolbar"><button id="add" class="primary">+ Thêm slide</button><button id="prev">← Trước</button><button id="next">Sau →</button><button id="present">Trình chiếu</button><button id="export">Xuất HTML</button><button id="save">Lưu</button><span class="status" id="count" aria-live="polite"></span></div><div class="slide-editor"><aside class="panel"><b>Danh sách slide</b><ol id="list" style="padding-left:22px"></ol></aside><section class="panel"><label for="heading">Tiêu đề slide</label><input id="heading" placeholder="Tiêu đề slide" style="width:100%;font-size:23px;font-weight:700"><label for="body">Nội dung</label><textarea id="body" placeholder="Nội dung slide..." style="width:100%;height:300px;margin-top:12px;padding:14px;border:1px solid var(--line);border-radius:8px;font:18px/1.6 system-ui"></textarea><p class="muted">Mỗi dòng là một ý trình bày. Bản V1 hỗ trợ nội dung chữ, lưu cục bộ và trình chiếu.</p></section></div></main><footer>HAI ĐẤT OFFICE · Hoạt động ngoại tuyến sau lần mở đầu tiên</footer><script type="module" src="app.js"></script></body></html>
