name: SGHT authentication and spreadsheet QA

on:
  push:
    branches: [v1-development, main]
    paths:
      - 'sght/**'
      - 'package.json'
      - '.github/workflows/sght-auth-qa.yml'
  pull_request:
    branches: [v1-development, main]
    paths:
      - 'sght/**'
      - 'package.json'
      - '.github/workflows/sght-auth-qa.yml'
  workflow_dispatch:

jobs:
  browser-and-engine-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run SGHT automated tests
        run: npm test

  auth-api-package-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: sght/server/package.json
      - name: Install authentication API dependencies
        run: npm install
        working-directory: sght/server
      - name: Check backend and mailer tests
        run: npm test
        working-directory: sght/server
