name: HAI DAT OFFICE WORK V6 QA
on:
  push:
    branches: [v5-development, v6-development]
  pull_request:
    branches: [v5-development]
  workflow_dispatch:
jobs:
  work-regression-and-pwa-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run WORK regression and PWA checks
        run: node --test tests/*.test.js
