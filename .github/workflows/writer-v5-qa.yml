name: HAI DAT Writer V5 QA
on:
  push:
    branches: [v5-development]
  pull_request:
    branches: [v5-development]
  workflow_dispatch:
jobs:
  backup-preflight-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run V4.9 and V5.0 QA tests
        run: node --test tests/*.test.js
