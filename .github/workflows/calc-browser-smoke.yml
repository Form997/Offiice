name: CALC browser smoke tests

on:
  push:
    branches: [v1-development]
    paths:
      - "calc/**"
      - ".github/workflows/calc-browser-smoke.yml"
  pull_request:
    paths:
      - "calc/**"
      - ".github/workflows/calc-browser-smoke.yml"
  workflow_dispatch:

jobs:
  chromium-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright
        run: npm install --no-save playwright
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run desktop and mobile-viewport smoke tests
        run: node calc/tests/browser-smoke.mjs
